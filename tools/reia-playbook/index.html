<title>REIA Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive guide to the REIA desk: every mission, role, hand-off, status and rule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass+Mono:wght@500;700&family=Overpass:wght@600;800;900&display=swap">
<style>
/* Layout: a wayfinding app. A line map of the REIA cycle up top; each station opens a
   mission drawn as a sequence of role lanes; the rest (players, powers, lifecycles,
   log-in relay, money, side quests, quiz) are tabs on the same signage bar. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E8EDF6; --ink:#121D35; --muted:#52607C; --line:#D2D9E8;
  --brand:#162F6A; --map-loop:#162F6A; --map-setup:#97A5C4;
  --head-bg:#162F6A; --head-ink:#FFFFFF; --head-muted:#C5D0E8; --signal:#FFC845; --on-signal:#1B1300;
  --good:#0F7F4E; --bad:#BF3328; --wait:#946000; --focus:#1F6FEB; --on-role:#FFFFFF; --scrim:rgb(9 14 28 / .5);
  --c-maker:#1F62D6; --c-checker:#946A00; --c-hod:#7A3CC6; --c-fin:#0D8357; --c-mgmt:#B2335E; --c-admin:#4A5872;
  --c-seller:#C64A14; --c-buyer:#0A7F97; --c-sys:#69738C;
  --font-display:"Overpass","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Overpass Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgb(18 29 53 / .06),0 6px 20px rgb(18 29 53 / .07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131B2E; --surface-2:#1B2541; --ink:#E5EBF7; --muted:#9DA9C4; --line:#29344F;
    --brand:#8FB0FF; --map-loop:#8FB0FF; --map-setup:#56648A;
    --head-bg:#0E1630; --head-ink:#EEF2FB; --head-muted:#9AA7C6; --signal:#FFC845; --on-signal:#1B1300;
    --good:#43CD8F; --bad:#FF8073; --wait:#F2BC4C; --focus:#86B4FF; --on-role:#0B1120; --scrim:rgb(0 0 0 / .62);
    --c-maker:#6AA2FF; --c-checker:#F1C24A; --c-hod:#B892F7; --c-fin:#45D196; --c-mgmt:#F383A6; --c-admin:#A8B4CE;
    --c-seller:#FF8C55; --c-buyer:#45CBE4; --c-sys:#A9B2C6;
    --shadow:0 1px 2px rgb(0 0 0 / .45),0 8px 24px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2E; --surface-2:#1B2541; --ink:#E5EBF7; --muted:#9DA9C4; --line:#29344F;
  --brand:#8FB0FF; --map-loop:#8FB0FF; --map-setup:#56648A;
  --head-bg:#0E1630; --head-ink:#EEF2FB; --head-muted:#9AA7C6; --signal:#FFC845; --on-signal:#1B1300;
  --good:#43CD8F; --bad:#FF8073; --wait:#F2BC4C; --focus:#86B4FF; --on-role:#0B1120; --scrim:rgb(0 0 0 / .62);
  --c-maker:#6AA2FF; --c-checker:#F1C24A; --c-hod:#B892F7; --c-fin:#45D196; --c-mgmt:#F383A6; --c-admin:#A8B4CE;
  --c-seller:#FF8C55; --c-buyer:#45CBE4; --c-sys:#A9B2C6;
  --shadow:0 1px 2px rgb(0 0 0 / .45),0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:800}
p{margin:0}
.eyebrow{font:700 12.5px/1.2 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lede{font-size:17px;color:var(--muted);max-width:70ch;margin-top:12px}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.lnk{border:0;background:none;padding:0;color:var(--brand);font:800 15px var(--font-display);cursor:pointer}
.lnk:hover{text-decoration:underline}

/* top signage bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:31}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg);color:var(--head-ink);box-shadow:0 1px 0 rgb(0 0 0 / .2)}
.top-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:11px;color:inherit;margin-right:auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font:900 20px/1 var(--font-display);letter-spacing:.01em}
.brand small{display:block;font-size:13px;color:var(--head-muted);margin-top:4px}
.xp{display:flex;align-items:center;gap:10px;font:700 13px/1 var(--font-mono);color:var(--head-muted);background:none;border:0;padding:4px 0;cursor:pointer}
.xp b{color:var(--head-ink);font-family:var(--font-display);font-weight:800;font-size:14px}
.xp-bar{width:110px;height:8px;border-radius:99px;background:rgb(255 255 255 / .16);overflow:hidden}
.xp-bar i{display:block;height:100%;background:var(--signal);width:0;transition:width .5s}
.theme-btn{border:1px solid rgb(255 255 255 / .28);background:transparent;color:var(--head-ink);border-radius:9px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.theme-btn .ic{width:18px;height:18px}
.tabs{flex:0 0 calc(100% + 20px);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:2px -10px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--head-muted);font:800 15px/1 var(--font-display);padding:12px 10px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--head-ink)}
.tab[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--signal)}

main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 150px;outline:none}
.blk{margin-top:44px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.blk-h p{color:var(--muted);font-size:15px}

/* role badges, status pills, button chips */
.rb{--c:var(--c-sys);display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on-role);font:900 12px/1 var(--font-display);letter-spacing:.02em;box-shadow:0 0 0 2px var(--surface);padding-top:.12em}
.rb .ic{width:60%;height:60%;margin-top:-.12em}
.rb.xs{width:20px;height:20px;font-size:9px}
.rb.sm{width:24px;height:24px;font-size:10.5px}
.rb.md{width:36px;height:36px;font-size:14px}
.rb.lg{width:44px;height:44px;font-size:16px}
.rb.xl{width:64px;height:64px;font-size:22px}
.st{display:inline-flex;align-items:center;font:700 12.5px/1.15 var(--font-mono);letter-spacing:.02em;padding:5px 8px 4px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);overflow-wrap:anywhere}
.st.good{border-color:var(--good);color:var(--good)}
.st.bad{border-color:var(--bad);color:var(--bad)}
.st.wait{border-color:var(--wait);color:var(--wait)}
.st.start{border-style:dashed;color:var(--muted)}
.st.big{font-size:14px;padding:8px 11px 7px}
.ui{display:inline-block;max-width:100%;font:700 14px/1.3 var(--font-display);padding:3px 8px 2px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);color:var(--ink);overflow-wrap:break-word;text-align:left}
.arw{color:var(--muted);font-weight:800}
.tag{font:700 11.5px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px 3px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px 10px;font:800 15px/1 var(--font-display);cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--bg)}
.btn.ok{border-color:var(--good);color:var(--good)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px 7px;font:800 14px/1 var(--font-display);cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done::after{content:"✓";color:var(--good);font-weight:900}
.chip[aria-current="true"].done::after{color:var(--signal)}

/* map view */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 48px;align-items:end;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 28px}
.stat b{display:block;font:900 36px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font:700 12px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:22px;padding:12px 14px 12px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);max-width:720px}
.me small{display:block;font:700 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.me b{font:800 17px var(--font-display)}
.me-bar{flex:1 1 120px;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.me-bar i{display:block;height:100%;background:var(--brand)}
.me-n{font-size:14.5px;color:var(--muted)}
.me-n b{font-size:15px;color:var(--ink)}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 10px;box-shadow:var(--shadow)}
.map-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:center;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14.5px;color:var(--muted)}
.lgd{display:inline-flex;align-items:center;gap:8px}
.lgd i{display:inline-block;width:30px;height:8px;border-radius:4px;background:var(--map-loop)}
.lgd i.s{background:var(--map-setup)}
.lgd i.d{width:16px;height:16px;border-radius:50%;background:var(--good)}
.map-svg svg{display:block;width:100%;height:auto}
.ln-setup{fill:none;stroke:var(--map-setup);stroke-width:10;stroke-linejoin:round}
.ln-loop{fill:none;stroke:var(--map-loop);stroke-width:12;stroke-linejoin:round}
.ln-term{stroke:var(--map-setup);stroke-width:8;stroke-linecap:round}
.chev{fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stn{cursor:pointer;outline:none}
.stn-c{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.stn-x{fill:var(--surface);stroke:var(--map-loop);stroke-width:4}
.stn-n{font:900 18px var(--font-display);fill:var(--ink)}
.stn-name{font:800 17px var(--font-display);fill:var(--ink)}
.stn-meta{font:700 12px var(--font-mono);fill:var(--muted)}
.stn:hover .stn-c,.stn:focus-visible .stn-c{stroke:var(--focus);stroke-width:7}
.stn:hover .stn-name,.stn:focus-visible .stn-name{fill:var(--focus)}
.stn.done .stn-c{fill:var(--good);stroke:var(--good)}
.stn.done .stn-n{fill:var(--surface)}
.m-note{font:700 12px var(--font-mono);letter-spacing:.14em;fill:var(--muted)}
.m-water{font:800 15px var(--font-mono);letter-spacing:.42em;fill:var(--muted)}
.bdg circle{fill:var(--c)}
.bdg text{font:900 10px var(--font-display);fill:var(--on-role)}
.ll{display:none}
.ll-h{font:700 12.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.ll-i{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 0;text-decoration:none;color:inherit}
.ll-i::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:6px;background:var(--map-loop)}
.ll-i.setup::before{background:var(--map-setup)}
.ll-n{position:relative;width:44px;height:44px;border-radius:50%;border:5px solid var(--ink);background:var(--surface);display:grid;place-items:center;font:900 17px var(--font-display);padding-top:.1em}
.ll-i.done .ll-n{background:var(--good);border-color:var(--good);color:var(--surface)}
.ll-t b{display:block;font:800 17px/1.2 var(--font-display)}
.ll-t small{font:700 12.5px var(--font-mono);color:var(--muted)}
.ll-b{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.rcard{--c:var(--c-sys);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.rcard:hover{border-color:var(--c)}
.rcard b{font:800 16px/1.2 var(--font-display);display:block}
.rcard small{color:var(--muted);font-size:14px;display:block}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(225px,100%),1fr));gap:12px}
.rule{padding:15px 16px;border-radius:12px;background:var(--surface-2);display:grid;gap:8px;align-content:start}
.rule .rw{display:flex;gap:4px;align-items:center;min-height:28px;color:var(--muted)}
.rule .rw .ic{width:22px;height:22px}
.rule b{font:800 16.5px/1.25 var(--font-display)}
.rule p{font-size:15px;color:var(--muted)}

/* mission view */
.mnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.mnav .sp{flex:1}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:20px 44px;align-items:start}
.mmeta{display:grid;gap:12px;margin:0;padding:16px 18px;border-radius:14px;background:var(--surface-2)}
.mmeta dt{font:700 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mmeta dd{margin:3px 0 0;font-weight:700;font-size:15.5px}
.mstats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:18px}
.mstat{font:700 13px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mstat b{font:900 22px/1 var(--font-display);color:var(--ink);margin-right:4px;letter-spacing:0}
.mplayers{display:flex;gap:4px;align-items:center}
.mact{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.lanes-wrap{margin-top:24px;overflow-x:auto;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.lane-key{display:none;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0;padding:14px 16px 0;font-size:14.5px;color:var(--muted)}
.lane-key > span{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700}
.lanes{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));padding:16px 4px 20px;position:relative}
.lhead{grid-column:var(--col);grid-row:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 6px 16px;position:relative;z-index:1}
.lhead b{font:800 15px/1.1 var(--font-display);text-align:center}
.lhead small{font:700 11.5px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.rail{grid-column:var(--col);grid-row:2 / var(--end);justify-self:center;width:4px;border-radius:4px;background:var(--c);opacity:.34}
.cell{grid-column:var(--col);grid-row:var(--row);padding:5px 8px;position:relative;z-index:1;min-width:0;container-type:inline-size}
.hand{grid-column:var(--a) / var(--b);grid-row:var(--row);position:relative;height:44px;z-index:2}
.hand .ln{position:absolute;top:50%;left:calc(50% / var(--k));right:calc(50% / var(--k));border-top:2px dashed var(--muted)}
.hand .ln::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.hand.fwd .ln::after{right:-4px;border-left:9px solid var(--muted)}
.hand.back .ln::after{left:-4px;border-right:9px solid var(--muted)}
.hand .pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:4px 11px 3px 5px;font:800 13.5px/1.2 var(--font-display);white-space:nowrap}
.hand .pill.auto{border-style:dashed;padding-left:10px}
/* Stack mode, when side-by-side lanes would be too narrow: one column, each card
   staggered to its lane's place, so a hand-off still reads as a move across. */
.lanes-wrap.stack .lane-key{display:flex}
.lanes-wrap.stack .lanes{--W:min(100%, 440px);grid-template-columns:minmax(0,1fr);padding:12px 8px 18px}
.lanes-wrap.stack .lhead{display:none}
.lanes-wrap.stack .rail{grid-column:1;justify-self:start;margin-left:calc((100% - var(--W)) * var(--i) / var(--nn) + var(--W) / 2 - 2px)}
.lanes-wrap.stack .cell{grid-column:1;padding-left:calc((100% - var(--W)) * var(--i) / var(--nn) + 6px);padding-right:calc((100% - var(--W)) * (var(--nn) - var(--i)) / var(--nn) + 6px)}
.lanes-wrap.stack .hand{--pl:calc((100% - var(--W)) * var(--l0) / var(--nn) + var(--W) / 2);--pr:calc((100% - var(--W)) * (var(--nn) - var(--h0)) / var(--nn) + var(--W) / 2);grid-column:1;height:auto;min-height:44px;display:flex;align-items:center;justify-content:center;padding:6px var(--pr) 6px var(--pl)}
.lanes-wrap.stack .hand .ln{left:var(--pl);right:var(--pr)}
.lanes-wrap.stack .hand .pill{position:relative;left:auto;top:auto;transform:none;flex:none}
.lanes-wrap.stack .sc-who{display:inline}
.step{--c:var(--c-sys);display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,opacity .2s,box-shadow .15s}
.step:hover{border-color:var(--c);transform:translateY(-1px)}
.step.opt{border-style:dashed}
.sc-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sc-no{font:700 12.5px var(--font-mono);color:var(--muted)}
.sc-t{font:800 16px/1.25 var(--font-display)}
.sc-press{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
.sep{color:var(--muted);font-weight:800;margin:0 4px}
.sc-res{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:14px;color:var(--muted)}
.sc-block{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.35;color:var(--bad)}
.sc-block .ic{margin-top:1px}
.sc-who{display:none;font:800 14px var(--font-display);color:var(--c)}
.sc-lock{display:inline-grid;color:var(--bad)}
.sc-go{margin-left:auto;font:800 20px/1 var(--font-display);color:var(--muted)}
@container (max-width:259px){ .sc-block{display:none} }
@container (min-width:260px){ .sc-lock{display:none} }
.step.cur{border-color:var(--c);box-shadow:0 0 0 3px var(--c),var(--shadow);transform:scale(1.025)}
body.playing .step:not(.cur){opacity:.4}
.mfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin-top:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.panel h3 .ic{color:var(--bad)}
.blist,.alist{margin:0;padding:0;list-style:none;display:grid;gap:10px}

/* ───────────────────────── helpers ───────────────────────── */
const KEY = 'reia-playbook-v1';
const P = (() => { let v = {}; try { v = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { v = {}; } return Object.assign({ done:{}, best:0, theme:'', lastM:0 }, v); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* storage blocked: progress lives for this visit only */ } };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const REDUCE = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;

const ICON = {
  lock:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="currentColor"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  login:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5H13v11H9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 8h8M7 4.8 10.2 8 7 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.2 8.4 3 3 6.6-6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  auto:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.2 1.6v3.2H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>',
};
const KIND = {};
'APPROVED ACTIVE VERIFIED LOCKED PAID CLOSED ISSUED SETTLED CONFIRMED RELEASED FUNDS_RECEIVED MATCHED ACCEPTED AGREED RECEIVED RECOVERED POSTED APPLIED REFUNDED IN_FORCE DISPATCHED'.split(' ').forEach((k) => { KIND[k] = 'good'; });
'REJECTED TERMINATED CANCELLED DISPUTED MISMATCH EXPIRED ESCALATED OBJECTED RETURNED_BY_CHECKER'.split(' ').forEach((k) => { KIND[k] = 'bad'; });
'PENDING PENDING_L2 PENDING_CHECKER SUBMITTED UNDER_APPROVAL UNDER_REVIEW INFO_REQUESTED PENDING_SIGN_OFF NEEDS_REVIEW RELEASE_PENDING NOTICE_ISSUED CLAIMED ACKNOWLEDGED UNDER_NEGOTIATION PENDING_REGULATORY_APPROVAL NEARING_EXPIRY PARTIALLY_PAID PARTIALLY_UTILIZED VALIDATED REOPENED ELIGIBLE UPHELD RECORDED PREPARED CALCULATED OPEN REQUESTED'.split(' ').forEach((k) => { KIND[k] = 'wait'; });
'DRAFT NOT_STARTED'.split(' ').forEach((k) => { KIND[k] = 'start'; });

const st = (s, big) => `<span class="st ${KIND[s] || ''}${big ? ' big' : ''}">${esc(String(s).replace(/_/g, ' '))}</span>`;
const fmt = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<span class="ui">$1</span>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\{([A-Z][A-Z0-9_]*)\}/g, (m, t) => st(t));
const rb = (k, size = '') => `<span class="rb ${size}" style="--c:var(--c-${R[k].c})" role="img" aria-label="${esc(R[k].name)}" title="${esc(R[k].name)}">${k === 'X' ? ICON.auto : R[k].b}</span>`;
const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const crore = (n) => `₹${(n / 1e7).toFixed(2)} Cr`;
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

// Missions and side quests play on one engine: each has an id ("m3", "q7") and
// its own list. A mission's progress stays under its number, as it always was.
MISSIONS.forEach((m) => { m.id = 'm' + m.n; m.kind = 'Mission'; m.list = MISSIONS; });
QUESTS.forEach((q, i) => { q.n = i + 1; q.id = 'q' + q.n; q.kind = 'Quest'; q.list = QUESTS; });
const BOOK = Object.fromEntries([...MISSIONS, ...QUESTS].map((m) => [m.id, m]));
const doneKey = (m) => (m.kind === 'Mission' ? m.n : m.id);
const isDone = (m) => !!P.done[doneKey(m)];
const zoneName = (m) => (m.kind === 'Mission' ? (m.zone === 'setup' ? 'One-time setup' : 'Every month') : 'Side quest · ' + QZONES.find(([z]) => z === m.zone)[1]);
const playersOf = (m) => [...new Set(m.steps.map((s) => s.who))];
const loginsIn = (m) => { let n = 0; let prev = null; m.steps.forEach((s) => { if (s.who !== prev && s.who !== 'X') n++; prev = s.who; }); return n; };
const loginHint = (k) => k === 'X' ? 'No log-in: the platform does this on its own.'
  : R[k].side === 'SJVN' ? `Sign-in page › Quick Demo Login › “${R[k].demo}”.`
  : `Sign in with the ${R[k].short.toLowerCase()} company’s own email and password.`;
function sessions(filter) {
  const out = [];
  MISSIONS.forEach((m) => {
    if (filter !== 'all' && m.zone !== filter) return;
    m.steps.forEach((s, i) => {
      const last = out[out.length - 1];
      if (last && last.who === s.who) last.items.push({ m, s, i });
      else out.push({ who:s.who, items:[{ m, s, i }] });
    });
  });
  return out;
}
const TOTAL_STEPS = MISSIONS.reduce((a, m) => a + m.steps.length, 0);
const LOGINS = sessions('all').filter((s) => s.who !== 'X').length;
const QUEST_STEPS = QUESTS.reduce((a, q) => a + q.steps.length, 0);
const MAXXP = (TOTAL_STEPS + QUEST_STEPS) * 10 + 100;
const RANKS = [[0,'Trainee'],[0.2,'Desk Officer'],[0.45,'Senior Officer'],[0.7,'Desk Lead'],[1,'REIA Pro']];
const xpNow = () => [...MISSIONS, ...QUESTS].reduce((a, m) => a + (isDone(m) ? m.steps.length * 10 : 0), 0) + (P.best || 0) * 10;
const rankOf = (x) => { let r = RANKS[0][1]; RANKS.forEach(([t, n]) => { if (x / MAXXP >= t - 1e-9) r = n; }); return r; };

/* ───────────────────────── shell ───────────────────────── */
const TABS = [['map','Map'],['missions','Missions'],['players','Players'],['powers','Powers'],['lifecycles','Lifecycles'],['relay','Log-in relay'],['money','Money'],['quests','Side quests'],['quiz','Quiz']];
const app = $('#app'); const drawer = $('#drawer'); const scrim = $('#scrim'); const hud = $('#hud'); const sw = $('#switch');
let current = 'map';

function paintXP() {
  const x = xpNow();
  $('#xp').innerHTML = `<b>${esc(rankOf(x))}</b><span class="xp-bar"><i style="width:${Math.min(100, x / MAXXP * 100).toFixed(1)}%"></i></span><span class="xp-n">${x} / ${MAXXP} XP</span>`;
}
function paintTheme() {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme').innerHTML = dark ? ICON.sun : ICON.moon;
  $('#theme').setAttribute('aria-label', dark ? 'Switch to light' : 'Switch to dark');
}
function paintTabs() {
  const sec = /^m\d+$/.test(current) ? 'missions' : /^q\d+$/.test(current) ? 'quests' : current;
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<button class="tab" type="button" data-go="${id}"${id === sec ? ' aria-current="page"' : ''}>${label}</button>`).join('');
}

function go(token, push = true) {
  if (token === 'missions') token = 'm' + (P.lastM || (MISSIONS.find((m) => !isDone(m)) || MISSIONS[0]).n);
  const views = { map:viewMap, players:viewPlayers, powers:viewPowers, lifecycles:viewLife, relay:viewRelay, money:viewMoney, quests:viewSide, quiz:viewQuiz };
  const playable = /^[mq]\d+$/.test(token);
  if (!playable && !views[token]) token = 'map';
  if (playable && !BOOK[token]) token = token[0] === 'q' ? 'quests' : 'm1';
  exitPlay();
  closeDrawer(true);
  current = token;
  const book = BOOK[token];
  app.innerHTML = book ? viewMission(token) : views[token]();
  if (book && book.kind === 'Mission') { P.lastM = book.n; save(); }
  after(token);
  paintTabs(); paintXP();
  window.scrollTo(0, 0);
  if (push) { try { history.pushState(null, '', '#' + token); } catch (e) { /* framed: keep state in the page */ } }
}
function after(token) {
  if (token === 'powers') paintPowers();

/* ───────────────────────── play mode ───────────────────────── */
let play = null; let swTimer = null; let swNext = null;
function startPlay(id) {
  if (!BOOK[id]) return;
  closeDrawer(true);
  play = { id, i:0 };
  document.body.classList.add('playing');
  showStep();
}
function showStep() {
  if (!play) return;
  const m = BOOK[play.id]; const s = m.steps[play.i];
  $$('.step').forEach((el) => el.classList.toggle('cur', el.dataset.step === `${play.id}:${play.i}`));
  const el = $(`.step[data-step="${play.id}:${play.i}"]`);
  if (el) el.scrollIntoView({ block:'center', inline:'center', behavior: REDUCE ? 'auto' : 'smooth' });
  hud.hidden = false;
  hud.innerHTML = `<div class="hud-dots">${m.steps.map((x, k) => `<span class="${k === play.i ? 'on' : k < play.i ? 'past' : ''}"></span>`).join('')}</div>
    <div class="hud-row">${rb(s.who,'md')}<div class="hud-txt"><small>Step ${play.i + 1} of ${m.steps.length} · ${esc(R[s.who].name)}${s.opt ? ' · if needed' : ''}</small><b>${fmt(s.t)}</b></div>
    <div class="hud-btns"><button class="hb" type="button" data-hud="prev"${play.i === 0 ? ' disabled' : ''} aria-label="Previous step">←</button><button class="hb" type="button" data-hud="info">Details</button><button class="hb primary" type="button" data-hud="next">${play.i === m.steps.length - 1 ? 'Finish' : 'Next →'}</button><button class="hb" type="button" data-hud="exit" aria-label="Stop playing">✕</button></div></div>`;
}
function stepPlay(d) {
  if (!play) return;
  const m = BOOK[play.id]; const j = play.i + d;
  if (j < 0) return;
  if (j >= m.steps.length) { finishPlay(); return; }
  const from = m.steps[play.i].who; const to = m.steps[j].who;
  play.i = j;
  if (d > 0 && from !== to && to !== 'X') showSwitch(from, to); else showStep();
}
function showSwitch(from, to) {
  clearTimeout(swTimer);
  sw.innerHTML = `<div class="sw-box" role="dialog" aria-label="Switch player"><p class="eyebrow">Switch player</p><h3>Log out, then log in as ${esc(R[to].name)}</h3>
    <div class="sw-row"><div class="sw-who sw-from">${rb(from,'xl')}${esc(R[from].short)}</div><div class="sw-arrow">→</div><div class="sw-who">${rb(to,'xl')}${esc(R[to].short)}</div></div>
    <p class="sw-hint">${esc(loginHint(to))}</p><div class="sw-btns"><button class="btn primary" type="button" data-sw="go">Continue</button></div></div>`;
  sw.hidden = false;
  swNext = () => { sw.hidden = true; swNext = null; showStep(); };
  const b = $('[data-sw="go"]', sw); if (b) b.focus({ preventScroll:true });
  swTimer = setTimeout(() => { if (swNext) swNext(); }, 2200);
}
function finishPlay() {
  const m = BOOK[play.id]; const n = m.n; const done = isDone(m); const more = n < m.list.length;
  const what = m.kind === 'Quest' ? 'Side quest' : 'Mission';
  const gain = done ? 0 : m.steps.length * 10;
  clearTimeout(swTimer);
  sw.innerHTML = `<div class="sw-box" role="dialog" aria-label="${what} complete"><p class="eyebrow">${what} ${n} complete</p><h3>${esc(m.name)}</h3>
    <div class="sw-row"><div class="sw-who">${playersOf(m).map((k) => rb(k,'md')).join('')}</div></div>
    <p class="sw-hint">${m.steps.length} steps, ${loginsIn(m)} log-ins.${gain ? ` Marking it done adds ${gain} XP.` : ' Already marked done.'}</p>
    <div class="sw-btns">${done ? '' : `<button class="btn primary" type="button" data-sw="done">${ICON.check} Mark done${more ? ' and go to the next' : ''}</button>`}${done && more ? `<button class="btn primary" type="button" data-sw="next">Next ${m.kind === 'Quest' ? 'quest' : 'mission'} →</button>` : ''}<button class="btn" type="button" data-sw="stay">Stay here</button></div></div>`;
  sw.hidden = false;
  swNext = null;
  const b = $('.sw-btns .btn', sw); if (b) b.focus({ preventScroll:true });
}
function exitPlay() {
  play = null; clearTimeout(swTimer); swNext = null;

}

const DEMO = { mwh:7920, ppa:2.75, margin:70, credit:50000, rebate:1.5, tds:true };
const MV = Object.assign({}, DEMO);
function moneyCalc(v) {
  const BP = v.mwh * 1000 * v.ppa;
  const margin = v.mwh * v.margin;
  const BS = BP + margin;
  const CN = Math.min(v.credit, BS);
  const paid = BS - CN;
  const realised = BS > 0 ? paid * BP / BS : 0;
  const rebate = BP * v.rebate / 100;
  const cap = Math.max(0, Math.min(realised, BP - rebate));
  const TDS = v.tds ? Math.max(0, BP - 5000000) * 0.001 : 0;
  const net = Math.max(0, cap - TDS);
  const held = Math.max(0, (BP - rebate) - cap);
  const keeps = paid - net - TDS;
  return { BP, margin, BS, CN, paid, realised, rebate, cap, TDS, net, held, keeps, psa: v.ppa + v.margin / 1000 };
}

  return `<section><p class="eyebrow">Side quests</p><h1>Everything else on the desk</h1>
    <p class="lede">The screens beyond the ten missions, each played the same way: lanes for each player, the button to press, where to log out and who logs in next. ${doneN} of ${QUESTS.length} done.</p></section>
    ${QZONES.map(([z, label]) => `<h2 class="side-h">${esc(label)}</h2><div class="sq">${QUESTS.filter((q) => q.zone === z).map(card).join('')}</div>`).join('')}`;
}

/* ───────────────────────── view: quiz ───────────────────────── */
// Roles that could also fairly answer a step's question, kept out of its options.
// 'skip' leaves the step out (both companies do it the same way).
const QX = { '1:0':['A'], '1:1':['A','S','B'], '1:2':['A'], '1:3':['A'], '2:1':'skip', '2:2':'skip', '4:0':['S','B'], '6:3':['C'], '7:0':['S','M'], '7:3':['S'], '7:5':['F'], '7:6':['S'], '10:5':['S'], '10:6':['B'] };
const POOL = (() => {
  const pool = [];
  MISSIONS.forEach((m) => m.steps.forEach((s, i) => {
    const qx = QX[`${m.n}:${i}`];
    if (s.who === 'X' || s.noquiz || qx === 'skip') return;
    pool.push({ q:`Whose move: “${s.t}”?`, press:s.press || null, ctx:`Mission ${m.n} · ${m.short}`, ans:s.who, not:[s.who, ...(s.alt || []), ...(qx || []), ...(s.who === 'H' ? ['G'] : [])], why:(s.rules && s.rules[0]) || s.block || '' });
  }));
  QUESTS.forEach((m) => m.steps.forEach((s, i) => {
    const qx = QX[`${m.id}:${i}`];
    if (s.who === 'X' || s.noquiz || qx === 'skip') return;
    pool.push({ q:`Whose move: “${s.t}”?`, press:s.press || null, ctx:`Side quest ${m.n} · ${m.short}`, ans:s.who, not:[s.who, ...(s.alt || []), ...(qx || []), ...(s.who === 'H' ? ['G'] : [])], why:(s.rules && s.rules[0]) || s.block || '' });
  }));
  MX.forEach((r) => {
    const ys = ROLE_ORDER.filter((k) => r.cell[k] === 'Y'); const yy = ROLE_ORDER.filter((k) => r.cell[k] === 'y');
    const a = r.a.replace(/`/g, '');
    if (ys.length === 1 && !yy.length) pool.push({ q:`Who can ${a.charAt(0).toLowerCase()}${a.slice(1)}?`, press:null, ctx:`Powers · ${r.mod}`, ans:ys[0], not:[ys[0]], why:r.note || '' });
  });
  return pool;
})();
let QZ = null;
function newRound() {
  const qs = shuffle(POOL).slice(0, 10).map((p) => {
    const others = shuffle(ROLE_ORDER.filter((k) => k !== 'G' && !p.not.includes(k))).slice(0, 3);
    return Object.assign({}, p, { opts:shuffle([p.ans, ...others]) });
  });
  QZ = { qs, i:0, score:0, picked:null, res:[] };
}
function viewQuiz() {
  if (!QZ) return `<section><p class="eyebrow">Quiz</p><h1>Who does it?</h1><p class="lede">Ten questions drawn from the missions, the side quests and the powers matrix. Pick the role that does each action. Your best score adds to your XP.</p></section>
    <div class="quiz qend"><div class="big">${P.best || 0}<span style="font-size:24px;color:var(--muted)"> / 10</span></div><p>Your best so far</p><button class="btn primary" type="button" data-quiz="start">${ICON.play} Start a round</button></div>`;
  const q = QZ.qs[QZ.i];
  if (!q) {
    const s = QZ.score;
    const msg = s === 10 ? 'Perfect. You know the desk.' : s >= 8 ? 'Strong. A couple to revisit.' : s >= 5 ? 'Getting there. Play the missions you missed.' : 'Worth a walk through the missions first.';
    return `<section><p class="eyebrow">Quiz</p><h1>Round complete</h1></section><div class="quiz qend"><div class="big">${s}<span style="font-size:24px;color:var(--muted)"> / 10</span></div><p>${msg}${s >= (P.best || 0) ? ' New best.' : ` Your best is ${P.best}.`}</p><button class="btn primary" type="button" data-quiz="start">Play again</button></div>`;
  }
  const answered = QZ.picked !== null;
  return `<section><p class="eyebrow">Quiz</p><h1>Who does it?</h1></section>
    <div class="quiz">
      <div class="qprog">${QZ.qs.map((x, k) => `<span class="${k < QZ.i ? (QZ.res[k] ? 'ok' : 'no') : k === QZ.i ? 'on' : ''}"></span>`).join('')}</div>
      <div class="qtop"><span>Question ${QZ.i + 1} of ${QZ.qs.length}</span><span>Score ${QZ.score}</span></div>
      <p class="qq">${esc(q.q)}</p>
      ${q.press ? `<p class="qhint">Presses ${q.press.map((p) => `<span class="ui">${esc(p)}</span>`).join('<span class="sep">›</span>')}</p>` : ''}
      <div class="qopts">${q.opts.map((k) => `<button class="qo${answered && k === q.ans ? ' right' : ''}${answered && k === QZ.picked && k !== q.ans ? ' wrong' : ''}" type="button" data-pick="${k}" style="--c:var(--c-${R[k].c})"${answered ? ' disabled' : ''}>${rb(k,'md')}${esc(R[k].name)}</button>`).join('')}</div>
      ${answered ? `<div class="qfb ${QZ.picked === q.ans ? 'ok' : 'no'}"><b>${QZ.picked === q.ans ? 'Right.' : `It’s the ${esc(R[q.ans].name)}.`}</b><span>${esc(q.ctx)}</span>${q.why ? `<span>${fmt(q.why)}</span>` : ''}<div><button class="btn primary" type="button" data-quiz="next">${QZ.i === QZ.qs.length - 1 ? 'See the score' : 'Next question →'}</button></div></div>` : ''}
    </div>`;
}

/* ───────────────────────── events ───────────────────────── */
document.addEventListener('click', (e) => {
  const t = e.target;
  const goEl = t.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const stepEl = t.closest('[data-step]');
  if (stepEl) { const [id, k] = stepEl.dataset.step.split(':'); const i = Number(k); if (play && play.id === id) { play.i = i; showStep(); } openDrawer(id, i); return; }
  const openEl = t.closest('[data-open]');
  if (openEl) { if (openEl.disabled) return; const [id, k] = openEl.dataset.open.split(':'); openDrawer(id, Number(k)); return; }
  if (t.closest('[data-close]') || t === scrim) { closeDrawer(); return; }
  const playEl = t.closest('[data-play]');
  if (playEl) { const id = playEl.dataset.play; if (current !== id) go(id); startPlay(id); return; }
  const doneEl = t.closest('[data-done]');
  if (doneEl) { const m = BOOK[doneEl.dataset.done]; const k = doneKey(m); P.done[k] = !P.done[k]; save(); go(m.id, false); return; }
  const hb = t.closest('[data-hud]');
  if (hb) { const a = hb.dataset.hud; if (a === 'next') stepPlay(1); else if (a === 'prev') stepPlay(-1); else if (a === 'exit') exitPlay(); else if (a === 'info' && play) openDrawer(play.id, play.i); return; }
  const swb = t.closest('[data-sw]');
  if (swb) {
    const a = swb.dataset.sw;
    if (a === 'go' && swNext) { swNext(); return; }
    if (a === 'done' && play) { const m = BOOK[play.id]; P.done[doneKey(m)] = true; save(); const nx = m.list[m.n]; go(nx ? nx.id : (m.kind === 'Quest' ? 'quests' : 'map')); return; }
    if (a === 'next' && play) { const nx = BOOK[play.id].list[BOOK[play.id].n]; if (nx) go(nx.id); return; }
    if (a === 'stay') { exitPlay(); return; }
    return;
  }
  if (t === sw && swNext) { swNext(); return; }
  const pl = t.closest('[data-player]');
  if (pl) { const k = pl.dataset.player; go('players'); const card = $('#p-' + k); if (card) { card.scrollIntoView({ block:'start' }); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1600); } return; }
  const md = t.closest('[data-mod]');
  if (md) { PW.mod = md.dataset.mod; $$('[data-mod]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mod === PW.mod))); paintPowers(); return; }
  const hl = t.closest('[data-hl]');
  if (hl) { PW.hl = PW.hl === hl.dataset.hl ? '' : hl.dataset.hl; paintPowers(); return; }
  const lc = t.closest('[data-lc]');
  if (lc) { LC = lc.dataset.lc; app.innerHTML = viewLife(); return; }
  const rf = t.closest('[data-rf]');
  if (rf) { RF = rf.dataset.rf; app.innerHTML = viewRelay(); return; }
  if (t.closest('[data-reset]')) { Object.assign(MV, DEMO); app.innerHTML = viewMoney(); paintMoney(); return; }
  const qz = t.closest('[data-quiz]');
  if (qz) {
    if (qz.dataset.quiz === 'start') newRound();
    else if (qz.dataset.quiz === 'next') { QZ.i++; QZ.picked = null; if (QZ.i >= QZ.qs.length && QZ.score > (P.best || 0)) { P.best = QZ.score; save(); paintXP(); } }
    app.innerHTML = viewQuiz(); return;
  }
  const pick = t.closest('[data-pick]');
  if (pick && QZ && QZ.picked === null) { const q = QZ.qs[QZ.i]; QZ.picked = pick.dataset.pick; const ok = QZ.picked === q.ans; QZ.res[QZ.i] = ok; if (ok) QZ.score++; app.innerHTML = viewQuiz(); return; }
  if (t.closest('#theme')) {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    P.theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = P.theme; save(); paintTheme();
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'pw-q') { PW.q = t.value; paintPowers(); return; }
  if (t.id && t.id.startsWith('mv-')) {
    const k = t.id.slice(3);
    if (k === 'tds') MV.tds = t.checked; else MV[k] = Number(t.value);
    paintMoney();
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'mv-tds') { MV.tds = e.target.checked; paintMoney(); } });
document.addEventListener('keydown', (e) => {
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  if (!sw.hidden) { if (swNext && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Escape')) { e.preventDefault(); swNext(); } else if (e.key === 'Escape') exitPlay(); return; }
  if (e.key === 'Escape') { if (drawer.classList.contains('open')) closeDrawer(); else if (play) exitPlay(); return; }
  if (play && !drawer.classList.contains('open')) {
    if (e.key === 'ArrowRight') { e.preventDefault(); stepPlay(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepPlay(-1); }
  }
});
window.addEventListener('popstate', () => go(location.hash.slice(1) || 'map', false));

if (P.theme === 'light' || P.theme === 'dark') document.documentElement.dataset.theme = P.theme;
paintTheme();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) { /* older browsers: the icon catches up on the next toggle */ }
go(location.hash.slice(1) || 'map', false);
})();
</script>
